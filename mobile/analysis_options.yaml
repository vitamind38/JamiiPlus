include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/**/*.g.dart
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - prefer_single_quotes
    - avoid_print
    - unawaited_futures

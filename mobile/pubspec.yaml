name: jamii_pulse
description: "Jamii Pulse: CHPs report barriers to care and hear back what was done."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true

# build_runner 2.16.1 allows analyzer 14.5.0, which removed a setter it still uses.
# Remove this once build_runner releases a fix (codegen only; nothing here ships in the app).
dependency_overrides:
  analyzer: ">=14.0.0 <14.5.0"

name: jamii_pulse
description: "Jamii Pulse: CHPs report barriers to care and hear back what was done."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/logo.png
    - assets/illustrations/

# Launcher icons from the logo drawn by scripts/brand_assets.py:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#2A78D6"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true

# build_runner 2.16.1 allows analyzer 14.5.0, which removed a setter it still uses.
# Remove this once build_runner releases a fix (codegen only; nothing here ships in the app).
dependency_overrides:
  analyzer: ">=14.0.0 <14.5.0"

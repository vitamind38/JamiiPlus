[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jamii-workers"
version = "0.1.0"
description = "Jamii Pulse background work: model pipeline, SMS retries, retention, sampling"
requires-python = ">=3.11"
dependencies = [
    "jamii-api",
    "celery[redis]>=5.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
